<title>Mascot Playground</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: stage (video + grid + 3D mascot) on the left, control panel on the right; stacked on a phone */
:root{--bg:#eef0f4;--panel:#ffffff;--fg:#1b1e27;--muted:#5d6475;--line:#d5d9e2;--accent:#3d5afe;--stage:#14161c;
--display:"Bricolage Grotesque",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101217;--panel:#181b22;--fg:#e9ebf1;--muted:#9aa1b2;--line:#2b303b;--accent:#7b8cff;--stage:#05060a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101217;--panel:#181b22;--fg:#e9ebf1;--muted:#9aa1b2;--line:#2b303b;--accent:#7b8cff;--stage:#05060a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
h1{font-family:var(--display);font-weight:700;font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px;max-width:70ch}
.wrap{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.wrap{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.stage{position:relative;background:var(--stage);border-radius:10px;overflow:hidden;margin:0 auto;max-width:100%;touch-action:manipulation;cursor:crosshair}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage video{object-fit:fill}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-family:var(--display);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,label.btn{font:inherit;font-size:.85rem;padding:7px 11px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
button:hover,label.btn:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.sl{display:grid;grid-template-columns:96px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:.85rem}
.sl output{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
textarea,input[type=text]{width:100%;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:8px;box-sizing:border-box}
textarea{min-height:90px;resize:vertical}
.status{font-size:.8rem;color:var(--muted);min-height:1.2em}
.legend{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.legend b{color:var(--fg);font-weight:600}
</style>

<h1>Mascot Playground</h1>
<p class="sub">The Mirrors mascot. Click the stage to send him there. Load your dance video and paste a comic JSON to watch him perform the whole choreography against your real timings. Nothing is uploaded: the video stays in your browser.</p>
<div class="wrap">
  <div><div class="stage" id="stage"><video id="vid" playsinline muted></video><canvas id="grid"></canvas><canvas id="gl"></canvas></div>
    <div class="status" style="margin-top:8px"><span id="clock"></span> <span id="status"></span></div>
    <div class="legend" id="legend"></div></div>
  <div class="panel">
    <h2>Play</h2>
    <div class="row">
      <button class="primary" id="demo">Demo choreography</button>
      <button id="play">Pause</button><button id="restart">Restart</button>
    </div>
    <div class="row">
      <label class="btn">Load video<input type="file" id="file" accept="video/*" hidden></label>
      <label class="row" style="gap:6px;font-size:.85rem"><input type="checkbox" id="showGrid" checked> Grid</label>
    </div>
    <h2>Your JSON</h2>
    <textarea id="json" placeholder='Paste a comic JSON (the one from the editor), then "Use JSON".'></textarea>
    <div class="row"><button id="useJson">Use JSON</button></div>
    <h2>Click-to-send words</h2>
    <input type="text" id="clickText" value="Here!">
    <h2>Tune</h2>
    <div id="sliders"></div>
    <div class="row"><button id="copy">Copy settings</button></div>
    <textarea id="copyOut" hidden readonly></textarea>
  </div>
</div>

<script>
// the fonts are added from script, so a slow or blocked font file can never hold back the page (a stylesheet link in the page would)
{const l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap";document.head.appendChild(l)}
// any error is written on the page, so a blank stage always says why
const showErr=m=>{const s=document.getElementById("status");if(s)s.textContent="Problem: "+m};
window.addEventListener("error",e=>showErr(e.message||"a script did not load"),true);
window.addEventListener("unhandledrejection",e=>showErr(String(e.reason&&e.reason.message||e.reason)));
setTimeout(()=>{if(!window.__mascotRunning)showErr("the 3D library did not start (check your connection, then reload)")},8000);
</script>
<script type="module">
// the full address instead of an import map: the viewer may load its own scripts first, which makes a late import map ignored
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

// ---------- settings (sliders) ----------
// the settings Sarah chose (7 Nov 2026); these are the defaults
const S = {size:10.5, walk:1.4, run:4.5, outline:1.5, turn:0.3, lead:0.2, minShow:0.85, sign:5.2, reach:2.4, jump:0.8, lean:0.3, skip:0.9, push:1, intro:2.2};
const SLIDERS = [["size","Size",8,30,0.5,"% of height"],["walk","Walk speed",0.5,3,0.1,"heights/s"],["run","Run speed",2,9,0.1,"heights/s"],
  ["outline","Outline",0,6,0.5,"px"],["turn","3D turn",0,1,0.05,"rad"],["lead","Arrive early",0,1,0.05,"s"],["skip","Same spot if closer than",0,3,0.05,"s"],["push","Push to the edge",0,1,0.05,"x"],["intro","Intro size",1,3,0.05,"x"],["sign","Sign size",1.5,9,0.1,"x"],["reach","Sign arm",1,3,0.05,"x"],["jump","Jump up to",0,3,0.1,"heights"],["lean","Lean in",0,0.5,0.02,"rad"],["minShow","Words at least",0.2,1.5,0.05,"s"]];
try{Object.assign(S,JSON.parse(localStorage.getItem("mascot-settings-4")||"{}"))}catch{}
const sl=document.getElementById("sliders");
for(const [k,label,mn,mx,st,unit] of SLIDERS){
  const d=document.createElement("div");d.className="sl";d.title=unit;
  d.innerHTML=`<label for="s-${k}">${label}</label><input type="range" id="s-${k}" min="${mn}" max="${mx}" step="${st}" value="${S[k]}"><output>${S[k]}</output>`;
  const inp=d.querySelector("input"),out=d.querySelector("output");
  inp.oninput=()=>{S[k]=+inp.value;out.textContent=inp.value;try{localStorage.setItem("mascot-settings-4",JSON.stringify(S))}catch{};rebuild()};
  sl.appendChild(d);
}

// ---------- stage size ----------
const stage=document.getElementById("stage"),vid=document.getElementById("vid"),gridC=document.getElementById("grid"),glC=document.getElementById("gl");
let W=400,H=711,aspect=9/16,N=20;
function layout(){
  const maxW=stage.parentElement.clientWidth, maxH=Math.max(320,window.innerHeight*0.78);
  W=Math.min(maxW,maxH*aspect);H=W/aspect;stage.style.width=W+"px";stage.style.height=H+"px";
  renderer.setSize(W,H,false);cam.left=0;cam.right=W;cam.top=0;cam.bottom=-H;cam.updateProjectionMatrix();drawGrid();rebuild();
}
function drawGrid(){
  const dpr=devicePixelRatio||1;gridC.width=W*dpr;gridC.height=H*dpr;const g=gridC.getContext("2d");g.scale(dpr,dpr);g.clearRect(0,0,W,H);
  if(!document.getElementById("showGrid").checked)return;
  g.strokeStyle="rgba(255,255,255,.28)";g.lineWidth=1;g.font=`700 ${Math.max(7,W/N*0.24)}px system-ui`;g.fillStyle="rgba(255,255,255,.55)";
  for(let i=1;i<N;i++){g.beginPath();g.moveTo(i*W/N,0);g.lineTo(i*W/N,H);g.moveTo(0,i*H/N);g.lineTo(W,i*H/N);g.stroke()}
  for(let c=0;c<N;c++)for(let r=0;r<N;r++)g.fillText(String.fromCharCode(65+c)+(r+1),c*W/N+2,r*H/N+W/N*0.28);
}
const cellXY=(name)=>{const c=name.charCodeAt(0)-65,r=parseInt(name.slice(1))-1;return{x:(c+.5)*W/N,y:(r+.5)*H/N}};

// ---------- three ----------
const renderer=new THREE.WebGLRenderer({canvas:glC,antialias:true,alpha:true});renderer.setPixelRatio(devicePixelRatio||1);
const scene=new THREE.Scene(),cam=new THREE.OrthographicCamera(0,W,0,-H,-5000,5000);cam.position.z=1000;
scene.add(new THREE.AmbientLight(0xffffff,Math.PI*0.62));const sun=new THREE.DirectionalLight(0xffffff,Math.PI*0.5);sun.position.set(300,600,900);scene.add(sun);
const white=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.45}),ink=new THREE.MeshBasicMaterial({color:0x000000,side:THREE.BackSide});

let man; // the built character: {root, parts..., h}
// the mirror mascot: a gold ornate frame with lavender glass (shine stripes; the words appear on it), black outline,
// short black arms and legs with block feet, and a hand mirror in his right hand
const gold=new THREE.MeshStandardMaterial({color:0xe6bf86,roughness:0.5}),blackM=new THREE.MeshStandardMaterial({color:0x1d1b1e,roughness:0.6});
function solid(geo,mat,outline=true,px=S.outline){const g=new THREE.Group(),m=new THREE.Mesh(geo,mat);g.add(m);if(outline&&px>0){const o=new THREE.Mesh(geo,ink);geo.computeBoundingSphere();o.scale.setScalar(1+px/Math.max(1,geo.boundingSphere.radius));o.position.copy(geo.boundingSphere.center).multiplyScalar(-(o.scale.x-1));g.add(o)}return g}
function limb(len,r,mat){const pivot=new THREE.Group(),p=solid(new THREE.CapsuleGeometry(r,Math.max(0.01,len-2*r),6,12),mat);p.position.y=-len/2;pivot.add(p);const end=new THREE.Group();end.position.y=-len;pivot.add(end);return{pivot,end}}
// the frame outline: straight sides with a small scroll, rounded shoulders, a crown point on top (units of h, y up from the frame's bottom)
function frameShape(h,inset=0){const s=new THREE.Shape(),k=(x,y)=>[x*h,y*h],w=0.27-inset;
  s.moveTo(...k(-w,inset));s.lineTo(...k(-w,0.40));s.lineTo(...k(-w-0.04+inset,0.44));s.lineTo(...k(-w,0.48));
  s.quadraticCurveTo(...k(-w,0.62-inset),...k(-0.13,0.66-inset));s.lineTo(...k(-0.08,0.71-inset));s.quadraticCurveTo(...k(-0.03,0.73-inset),...k(0,0.80-inset*1.6));
  s.quadraticCurveTo(...k(0.03,0.73-inset),...k(0.08,0.71-inset));s.lineTo(...k(0.13,0.66-inset));s.quadraticCurveTo(...k(w,0.62-inset),...k(w,0.48));
  s.lineTo(...k(w+0.04-inset,0.44));s.lineTo(...k(w,0.40));s.lineTo(...k(w,inset));s.closePath();return s}
function glassShape(h){const s=new THREE.Shape(),k=(x,y)=>[x*h,y*h];s.moveTo(...k(-0.17,0.14));s.lineTo(...k(-0.17,0.44));s.quadraticCurveTo(...k(-0.17,0.62),...k(0,0.65));
  s.quadraticCurveTo(...k(0.17,0.62),...k(0.17,0.44));s.lineTo(...k(0.17,0.14));s.quadraticCurveTo(...k(0.17,0.06),...k(0,0.06));s.quadraticCurveTo(...k(-0.17,0.06),...k(-0.17,0.14));return s}
function build(){
  if(man){scene.remove(man.root,man.portal,man.rope,man.target,...man.puffs,...man.dust,...man.lines)} // the old character, portal and puffs go before the new ones
  const h=H*S.size/100,r=h*0.055,root=new THREE.Group(),body=new THREE.Group();root.add(body);
  const hips=new THREE.Group();hips.position.y=h*0.22;body.add(hips);
  const torso=new THREE.Group();hips.add(torso);
  const depth=h*0.09,frame=solid(new THREE.ExtrudeGeometry(frameShape(h),{depth,bevelEnabled:true,bevelSize:h*0.012,bevelThickness:h*0.02,bevelSegments:3,curveSegments:16}),gold);
  frame.position.z=-depth/2;torso.add(frame);
  // the glass: its own canvas (stripes, and the words when he shows a move); a face cap just in front of the frame
  const gc=document.createElement("canvas");gc.width=360;gc.height=640; /* the glass's own proportions, so the words aren't squeezed */const gtex=new THREE.CanvasTexture(gc);gtex.colorSpace=THREE.SRGBColorSpace;
  const gGeo=new THREE.ShapeGeometry(glassShape(h),24);gGeo.computeBoundingBox();const bb=gGeo.boundingBox,uv=gGeo.attributes.uv,pos=gGeo.attributes.position;
  for(let i=0;i<uv.count;i++)uv.setXY(i,(pos.getX(i)-bb.min.x)/(bb.max.x-bb.min.x),(pos.getY(i)-bb.min.y)/(bb.max.y-bb.min.y));
  const glass=new THREE.Mesh(gGeo,new THREE.MeshBasicMaterial({map:gtex}));glass.position.z=depth/2+h*0.022;torso.add(glass);
  const glassRim=new THREE.Mesh(new THREE.ShapeGeometry(glassShape(h),24),new THREE.MeshBasicMaterial({color:0x1d1b1e}));glassRim.scale.set(1.08,1.04,1);glassRim.position.set(0,-h*0.012,depth/2+h*0.018);torso.add(glassRim);
  const mk=(x,y,l1,l2,parent)=>{const s=new THREE.Group();s.position.set(x,y,0);parent.add(s);const a=limb(l1,r,blackM),b=limb(l2,r,blackM);s.add(a.pivot);a.end.add(b.pivot);return{s,up:a.pivot,lo:b.pivot,hand:b.end,l1,l2}};
  const armR=mk(h*0.29,h*0.38,h*0.15,h*0.13,torso),armL=mk(-h*0.29,h*0.38,h*0.15,h*0.13,torso); // R = screen right
  const legR=mk(h*0.11,h*0.02,h*0.12,h*0.1,hips),legL=mk(-h*0.11,h*0.02,h*0.12,h*0.1,hips);
  for(const L of [legR,legL]){const foot=solid(new THREE.BoxGeometry(h*0.16,h*0.06,h*0.11),blackM);foot.position.set(0,-h*0.015,h*0.02);L.hand.add(foot)}
  // each hand: a black fist, and a big white glove with the index finger out (white with a thick black outline reads on any background)
  const glovePx=S.outline+2.5;
  for(const A of [armR,armL]){A.fist=solid(new THREE.SphereGeometry(r*1.35,14,10),blackM);A.hand.add(A.fist);
    A.glove=new THREE.Group();const palm=solid(new THREE.SphereGeometry(r*1.7,16,12),white,true,glovePx);
    const finger=solid(new THREE.CapsuleGeometry(r*0.8,h*0.2,6,10),white,true,glovePx);finger.position.y=-(r*1.4+h*0.1);
    const thumb=solid(new THREE.CapsuleGeometry(r*0.5,h*0.04,5,8),white,true,glovePx);thumb.position.set(r*1.3,-r*0.6,0);thumb.rotation.z=0.9;
    A.glove.add(palm,finger,thumb);A.glove.visible=false;A.hand.add(A.glove)}
  // the target ring on the cell he points at: white inside a black ring, pulsing
  const target=new THREE.Group(),tr=Math.max(W/N*0.75,h*0.14);
  target.add(new THREE.Mesh(new THREE.TorusGeometry(tr,tr*0.22,8,40),new THREE.MeshBasicMaterial({color:0x000000})));
  const tw=new THREE.Mesh(new THREE.TorusGeometry(tr,tr*0.11,8,40),new THREE.MeshBasicMaterial({color:0xffffff}));tw.position.z=1;target.add(tw);target.visible=false;scene.add(target);
  // the hand mirror in his right hand: handle, gold oval rim, glass
  const hm=new THREE.Group();const handle=solid(new THREE.CapsuleGeometry(h*0.022,h*0.1,5,10),gold);handle.position.y=h*0.07;hm.add(handle);
  const rim=solid(new THREE.TorusGeometry(h*0.075,h*0.018,10,32),gold);rim.position.y=h*0.21;rim.scale.y=1.25;hm.add(rim);
  const hc=document.createElement("canvas");hc.width=400;hc.height=500;const htex=new THREE.CanvasTexture(hc);htex.colorSpace=THREE.SRGBColorSpace;
  const hg=new THREE.Mesh(new THREE.CircleGeometry(h*0.07,40),new THREE.MeshBasicMaterial({map:htex}));hg.position.set(0,h*0.21,h*0.022);hg.scale.y=1.25;hm.add(hg);
  hm.rotation.z=Math.PI;armR.hand.add(hm); /* glass beyond the fist, facing the camera; it grows into a sign when he holds it up */
  const rope=new THREE.Mesh(new THREE.CylinderGeometry(h*0.018,h*0.018,1,8),new THREE.MeshStandardMaterial({color:0x7a5532,roughness:0.9}));rope.visible=false;scene.add(rope);
  const dust=[...Array(8)].map(()=>{const m=new THREE.Mesh(new THREE.SphereGeometry(h*0.045,10,8),new THREE.MeshBasicMaterial({color:0xe3ddd2,transparent:true}));m.visible=false;scene.add(m);return m});
  const lines=[...Array(3)].map(()=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(1,h*0.018),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true}));m.visible=false;scene.add(m);return m});
  const shadow=new THREE.Mesh(new THREE.CircleGeometry(h*0.24,32),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.28}));shadow.scale.y=0.25;shadow.position.z=-h;root.add(shadow);
  // portal ring and poof puffs
  const portal=new THREE.Group(),ring=new THREE.Mesh(new THREE.TorusGeometry(h*0.34,h*0.035,10,48),new THREE.MeshBasicMaterial({color:0x111111}));
  const disc=new THREE.Mesh(new THREE.CircleGeometry(h*0.33,48),new THREE.MeshBasicMaterial({color:0xcfcfe0,transparent:true,opacity:.85}));portal.add(disc,ring);portal.scale.y=1.25;scene.add(portal);
  const puffs=[...Array(7)].map(()=>{const m=new THREE.Mesh(new THREE.SphereGeometry(h*0.05,10,8),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true}));scene.add(m);return m});
  scene.add(root);man={root,body,hips,torso,armR,armL,legR,legL,shadow,gc,gtex,portal,puffs,h,text:undefined,target,hm,hc,htex,signText:undefined,rope,dust,lines};drawGlass(null,0);drawSign("");
}
// the hand mirror's glass: lavender with a shine stripe, and the move's words big enough to read when he holds it up
function drawSign(text){
  if(man.signText===text)return;man.signText=text;const g=man.hc.getContext("2d"),w=400,hh=500;
  g.fillStyle="#cbcbdd";g.fillRect(0,0,w,hh);g.save();g.translate(w/2,hh/2);g.rotate(-0.6);g.fillStyle="rgba(255,255,255,.7)";g.fillRect(-120,-400,36,800);g.restore();
  if(text){g.fillStyle="rgba(255,255,255,.8)";g.fillRect(0,0,w,hh);g.fillStyle="#111";g.textAlign="center";g.textBaseline="middle";
    const words=String(text).toUpperCase().split(/\s+/);let fs=120;const set=()=>g.font=`700 ${fs}px "Comic Neue",system-ui`;set();
    while(fs>20&&(words.length*fs*1.05>hh*0.62||words.some(x=>g.measureText(x).width>w*0.62))){fs-=4;set()} // inside the oval
    g.lineJoin="round";g.lineWidth=fs*0.11;g.strokeStyle="#111"; // a thick outline makes the letters read bolder than the font's heaviest weight
    words.forEach((x,i)=>{const y=hh/2+(i-(words.length-1)/2)*fs*1.05;g.strokeText(x,w/2,y);g.fillText(x,w/2,y)})}
  man.htex.needsUpdate=true;
}
// the glass face: lavender with two white shine stripes; with a move, its words in big black comic letters over the glass
function drawGlass(text,k){
  const key=text?text+"|"+(k>0.5):"";if(man.text===key)return;man.text=key;const g=man.gc.getContext("2d"),W2=360,H2=640;
  g.fillStyle="#cbcbdd";g.fillRect(0,0,W2,H2);g.save();g.translate(W2/2,H2/2);g.rotate(-0.6);g.fillStyle="rgba(255,255,255,.75)";g.fillRect(-60,-500,46,1000);g.fillRect(20,-500,22,1000);g.restore();
  if(text&&k>0.5){g.fillStyle="rgba(255,255,255,.82)";g.fillRect(0,0,W2,H2);g.fillStyle="#111";g.textAlign="center";g.textBaseline="middle";
    const words=String(text).toUpperCase().split(/\s+/);let fs=130;g.font=`700 ${fs}px "Comic Neue",system-ui`;
    while(fs>24&&(words.length*fs*1.05>H2*0.8||words.some(w=>g.measureText(w).width>W2*0.86))){fs-=6;g.font=`700 ${fs}px "Comic Neue",system-ui`}
    words.forEach((w,i)=>g.fillText(w,W2/2,H2*0.52+(i-(words.length-1)/2)*fs*1.05))} // one word per line, like the bubbles
  man.gtex.needsUpdate=true;
}

// ---------- choreography: where he is and what he does at time T ----------
// moves: [{t, x, y, text}] in time order. For each move he arrives "lead" seconds early, points, and the paper is up at t.
// Between moves he picks how to travel from the time he has: walk, run (with a slide if it's tight), portal, or poof.
let plan=[];
function makePlan(moves,start,startT=0){
  const h=man.h,out=[];let pos=start??null;
  // moves that come sooner than "Same spot if closer than" after the move before them share one stop: he stays put,
  // the words change on the sign at each move's time, and he points at each move's cell in turn
  const stops=[];moves.forEach(m=>{const g=stops[stops.length-1];if(g&&m.t-g[g.length-1].t<S.skip)g.push(m);else stops.push([m])});
  stops.map(items=>({t:items[0].t,text:items[0].text,x:items.reduce((a,b)=>a+b.x,0)/items.length,y:items.reduce((a,b)=>a+b.y,0)/items.length,items})).forEach((m,i)=>{
    if(i===0&&m.items[0].name&&!start){
      // the name intro: he's close to the camera (big, low in the corner away from the dancer, feet below the frame),
      // points at the dancer and holds the name up on the mirror, about half the screen
      const B=S.intro,hB=h*B,n0=m.items[0],side=n0.x<W/2?1:-1;
      const edgeB=hB*0.29+hB*0.115*S.sign+10; // far enough in that the whole name sign fits above him

    }
    // where he stands. m.x/m.y is the middle of the stop's cells. Close by for a quick single move; the longer the stop

}

// ---------- poses ----------
function pose(p){

function frame(T){
  const st=state(T),h=man.h,R=man.root;man.portal.visible=false;man.rope.visible=false;man.target.visible=false;[...man.puffs,...man.dust,...man.lines].forEach(m=>m.visible=false);

    const s=st.m.stand;place(s.x,s.y);R.rotation.y=-st.m.side*S.turn;R.scale.setScalar(Math.max(0.01,S.intro*back(st.u)));pose({});return "Intro (close up)"}

      m.position.set(q.x+Math.sin(j*2.1)*h*0.05*spread,-(q.y-h*0.03)+j*h*0.012,6);m.scale.setScalar(0.6+j*0.18*spread);m.material.opacity=0.55*(1-j/n)})};

      m.position.set(R.position.x-vx/len*(h*0.35+L/2),R.position.y+vy/len*(h*0.35+L/2)+h*(0.3+0.2*j),8);m.rotation.z=Math.atan2(-vy,vx);m.material.opacity=0.45-j*0.1})};

        pose({kll:0.9,klr:0.6,ll:-0.6,lr:0.3,arz:2.5,alz:-2.5});speedLines(tr.to.x-tr.from.x,tr.to.y-tr.from.y);return "Jump"}
      const k=(u-0.85)/0.15;place(tr.to.x,tr.to.y);pose({kll:1.1*(1-k),klr:1.1*(1-k),ll:-0.5*(1-k),lr:-0.5*(1-k),bob:-h*0.09*(1-k),arz:1.2*(1-k),alz:-1.2*(1-k)});trail(4,1.2);return "Jump (land)"}

    if(tr.mode==="slide"){pose({lean:-0.45,ll:-1.25,lr:0.25,kll:0.1,klr:1.1,arz:1.4,alz:-1.4,al:0.4,ar:0.4,bob:-h*0.09});trail(8,1.6);speedLines(tr.to.x-tr.from.x,tr.to.y-tr.from.y);return "Slide (diagonal)"}

  // standing at the move: point at the cell with one hand and hold the sign up with the other, right as he lands
  const m=st.m,s=m.stand,B=m.scale||1,hS=h*B;place(s.x,s.y);R.rotation.y=-m.side*S.turn;R.scale.setScalar(B);

// stretch an arm (f = 1 normal): the upper and lower arm get longer, the hand moves out with them

// ---------- time, input, modes ----------
let moves=[],t0=performance.now()/1000,paused=false,pauseAt=0,useVideo=false,loopEnd=0,free=true;

function rebuildPlan(start){if(man)plan=makePlan(moves,start,0)}
function rebuild(){build();rebuildPlan(free&&plan[0]?.travel?plan[0].travel.from:null);legend()}
function restart(){if(useVideo){vid.currentTime=0;vid.play()}t0=performance.now()/1000;paused=false;document.getElementById("play").textContent="Pause"}
const DEMO=[["J8",0.7,"Stella Revheim",true],["E5",2.5,"Kick out"],["O5",3.7,"Swing hands"],["O15",5.3,"Drop down"],["B19",6.9,"Slide left"],["N9",8.3,"Cross jump"],["Q10",9.1,"Freeze"],["R18",10.5,"Spin"]];
function demo(){free=false;useVideo=false;vid.pause();setMoves(DEMO.map(([c,t,text,name])=>({...cellXY(c),t,text,name:!!name})));restart();legend()}
function fromJSON(){
  try{const j=JSON.parse(document.getElementById("json").value);N=j.grid?.size||20;drawGrid();
    const caps=(j.captions||[]).filter(c=>c.cells?.length).sort((a,b)=>a.from-b.from);
    if(!caps.length)throw new Error("no captions with cells");
    free=false;setMoves(caps.map(c=>({...cellXY(c.cells[0]),t:c.from,text:c.text,name:c.id===1})),{loop:!vid.src}); // caption 1 = the name: the close-up intro
    if(vid.src){useVideo=true;vid.currentTime=0;vid.play()}else restart();

  }catch(e){status("That JSON could not be read: "+e.message)}
}
stage.addEventListener("click",ev=>{
  const b=stage.getBoundingClientRect(),x=ev.clientX-b.left,y=ev.clientY-b.top;
  const R=man.root,cur=R.visible&&R.scale.x>0.5?{x:R.position.x,y:-R.position.y}:{x:W/2,y:H*0.85}; // wherever he is right now
  free=true;useVideo=false;vid.pause();t0=performance.now()/1000;paused=false;
  const d=Math.hypot(x-cur.x,y-cur.y)/man.h;
  setMoves([{x,y,t:S.lead+d/S.run+0.1,text:document.getElementById("clickText").value||"Here!"}],{loop:false,start:cur});
  legend();
});
document.getElementById("demo").onclick=demo;document.getElementById("useJson").onclick=fromJSON;document.getElementById("restart").onclick=restart;
document.getElementById("play").onclick=e=>{if(useVideo){vid.paused?vid.play():vid.pause();e.target.textContent=vid.paused?"Play":"Pause";return}

document.getElementById("showGrid").onchange=drawGrid;
document.getElementById("file").onchange=e=>{const f=e.target.files[0];if(!f)return;vid.src=URL.createObjectURL(f);vid.onloadedmetadata=()=>{aspect=vid.videoWidth/vid.videoHeight;layout();status(`${f.name}: ${vid.videoWidth}×${vid.videoHeight}. Paste its JSON and press "Use JSON".`)}};
document.getElementById("copy").onclick=async()=>{const t=JSON.stringify(S);try{await navigator.clipboard.writeText(t);status("Settings copied: paste them to Claude.")}catch{const o=document.getElementById("copyOut");o.hidden=false;o.value=t;o.select();status("Copy the selected text.")}};
const status=t=>document.getElementById("status").textContent=t;
function legend(){document.getElementById("legend").innerHTML=plan.filter(m=>m.t>=0).map(m=>m.items.map((it,j)=>`<span${j?' style="opacity:.75"':""}><b>${it.t.toFixed(2)}s</b> ${it.text} · ${j?"same spot":m.travel?.mode??"start"}</span>`).join("")).join("")}
window.addEventListener("resize",layout);

build();layout();demo();
// start right away; the sign switches to the comic font when it has loaded (a slow or blocked font never stops the animation)
document.fonts.load('700 40px "Comic Neue"').then(()=>{man.text=null;man.signText=undefined}).catch(()=>{});
window.__mascotRunning=true;
function loop(){let T=now();if(!useVideo&&loopEnd&&T>loopEnd){restart();T=0}const lab=frame(T);
  document.getElementById("clock").textContent=`${T.toFixed(2)} s · ${lab} ·`;renderer.render(scene,cam);requestAnimationFrame(loop)}
loop();
</script>
