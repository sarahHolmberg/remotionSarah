<!doctype html>
<!-- app/parrot.html -->
<!-- NEW FILE: the Parrot site (served at /parrot/): turn transcripts into scripts, one at a time, made for a phone. Code: app/parrot.tsx -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#245edb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Parrot" />
    <link rel="manifest" href="/parrot/manifest.webmanifest" />
    <link rel="icon" href="/parrot/icon.svg" />
    <link rel="apple-touch-icon" href="/parrot/icon.svg" />
    <title>Parrot</title>
    <style>
      /* Windows XP look, the same as the comic editor: "Bliss" desktop, a blue-titled beige window, a blue taskbar
         holding the one big (green, Start-button style) action button */
      :root { --beige: #ece9d8; --line: #aca899; --blue: #0a5fe0; --link: #0046d5; --field: #7f9db9; --ok: #2f9e2f; --err: #b3261e; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font: 15px/1.45 Tahoma, "Segoe UI", system-ui, sans-serif; color: #000;
        background: linear-gradient(#4f8fe6 0%, #a9d0f7 45%, #b9e08f 46%, #5fa43a 72%, #3f7d27 100%) fixed;
      }
      #root { min-height: 100dvh; }
      .desk { min-height: 100dvh; padding: calc(10px + env(safe-area-inset-top)) 10px calc(96px + env(safe-area-inset-bottom)); }
      .win {
        max-width: 560px; margin: 0 auto; background: var(--beige); border: 3px solid var(--blue); border-top: 0;
        border-radius: 9px 9px 3px 3px; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45); overflow: hidden;
      }
      .title {
        display: flex; align-items: center; gap: 8px; padding: 6px 5px 6px 8px; color: #fff; font-weight: 700; font-size: 16px;
        text-shadow: 1px 1px 0 #0a246a; background: linear-gradient(#3d95ff 0%, #0a5fe0 12%, #0553d0 72%, #0a47b8 100%);
      }
      .ticon { font-size: 18px; line-height: 1; text-shadow: none; }
      .ttext { flex: 1; }
      .count { font-size: 13px; font-weight: 400; opacity: 0.95; margin-right: 4px; }
      .cb {
        flex: none; width: 26px; height: 26px; border: 1px solid #fff; border-radius: 4px; color: #fff; font-size: 14px; line-height: 24px; text-align: center;
        background: linear-gradient(#5aa0ff, #2f6fe4 60%, #2658c8); text-shadow: none;
      }
      .cb.x { background: linear-gradient(#e8836b, #d9482a 60%, #b8321a); }
      .main { padding: 14px 12px 12px; display: flex; flex-direction: column; min-height: 46dvh; }
      .card { position: relative; border: 1px solid var(--line); border-radius: 4px; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 12px; background: var(--beige); }
      .name { font-size: 26px; font-weight: 700; margin: 0; color: var(--link); }
      /* the steps as an XP progress bar: green blocks */
      .dots { display: flex; gap: 3px; padding: 3px; background: #fff; border: 1px solid var(--field); border-radius: 3px; }
      .dots span { flex: 1; height: 12px; background: transparent; }
      .dots span.on { background: linear-gradient(#acedad, #2fb52f 50%, #2fb52f 60%, #acedad); }
      .say { font-size: 17px; margin: 0; }
      .hint { font-size: 13px; color: #444; margin: 0; }
      .ok { color: var(--ok); font-weight: 700; }
      .row { display: flex; gap: 16px; flex-wrap: wrap; }
      .link { background: none; border: 0; padding: 6px 0; color: var(--link); font: inherit; font-size: 15px; cursor: pointer; text-decoration: underline; }
      .open {
        display: block; text-align: center; padding: 12px; color: #000; font-weight: 700; font-size: 16px; text-decoration: none;
        border: 1px solid #003c74; border-radius: 4px; background: linear-gradient(#fff 0%, #f1efe7 70%, #d6d0c5 100%);
      }
      .open:active { background: linear-gradient(#d6d0c5, #f1efe7); }
      .blind {
        width: 100%; min-height: 120px; padding: 12px; color: transparent; caret-color: transparent; text-align: center; font: 18px Tahoma, sans-serif;
        background: #fff; border: 2px dashed var(--field); border-radius: 3px;
      }
      .blind::placeholder { color: var(--link); font-weight: 700; line-height: 90px; }
      .blind::selection { background: transparent; }
      .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 24px 8px; }
      .emoji { font-size: 60px; }
      .ver { text-align: center; font-size: 11px; color: #555; margin: 14px 0 0; }
      /* the taskbar with the one big button, styled like the XP Start button */
      .dock {
        position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        border-top: 1px solid #0b3a9a; background: linear-gradient(#3f8cf3 0%, #245edb 10%, #245edb 60%, #1941a5 100%);
      }
      .big {
        display: block; width: 100%; max-width: 536px; margin: 0 auto; min-height: 58px; cursor: pointer; border: 0; border-radius: 12px;
        color: #fff; font: italic 700 21px/1 Tahoma, "Segoe UI", sans-serif; text-shadow: 1px 1px 2px #1b4d12;
        box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.6), 0 2px 5px rgba(0, 0, 0, 0.45);
        background: linear-gradient(#6cc35a 0%, #3c9a2c 15%, #2f8a22 70%, #276f1b 100%);
      }
      .big:active { filter: brightness(0.9); }
      .big:disabled { filter: grayscale(0.5); opacity: 0.8; cursor: default; }
      .big.alt { text-shadow: 1px 1px 2px #6b3a00; background: linear-gradient(#ffc76b 0%, #f0a030 15%, #dc8a16 70%, #b86f0c 100%); }
      .ring { width: 18px; height: 18px; border: 3px solid rgba(255, 255, 255, 0.5); border-top-color: #fff; border-radius: 50%; display: inline-block; vertical-align: -3px; margin-right: 10px; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      /* messages as an XP balloon tip */
      .toast {
        position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5; max-width: 90vw;
        background: #ffffe1; color: #000; border: 1px solid #000; border-radius: 7px; padding: 9px 14px; font-size: 14px; font-weight: 700;
        box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.35);
      }
      .toast::before { content: "ℹ️ "; }
      @media (prefers-reduced-motion: reduce) { .ring { animation-duration: 2.5s; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/parrot.tsx"></script>
  </body>
</html>
