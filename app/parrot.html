<!doctype html>
<!-- app/parrot.html -->
<!-- NEW FILE: the Parrot site (served at /parrot/): turn transcripts into scripts, one at a time, made for a phone. Code: app/parrot.tsx -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f9d75" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Parrot" />
    <link rel="manifest" href="/parrot/manifest.webmanifest" />
    <link rel="icon" href="/parrot/icon.svg" />
    <link rel="apple-touch-icon" href="/parrot/icon.svg" />
    <title>Parrot</title>
    <style>
      :root {
        --bg: #f3f7f5; --card: #ffffff; --ink: #142420; --soft: #5d6f69; --line: #dde7e3;
        --brand: #0f9d75; --brand-dark: #0b7a5b; --ok: #1f9d55; --err: #c0392b; --warn: #b7791f;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0d1513; --card: #16211e; --ink: #e8f1ee; --soft: #9db0aa; --line: #253430; --brand: #17b88a; --brand-dark: #12936e; }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #root { min-height: 100dvh; display: flex; flex-direction: column; }
      .top { display: flex; align-items: center; justify-content: space-between; padding: calc(12px + env(safe-area-inset-top)) 16px 8px; }
      .brand { font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
      .count { font-size: 14px; color: var(--soft); }
      .main { flex: 1; display: flex; flex-direction: column; padding: 8px 16px calc(120px + env(safe-area-inset-bottom)); max-width: 560px; width: 100%; margin: 0 auto; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06); }
      .name { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin: 0; }
      .dots { display: flex; gap: 6px; }
      .dots span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); transition: background 0.3s; }
      .dots span.on { background: var(--brand); }
      .say { font-size: 18px; margin: 0; }
      .hint { font-size: 14px; color: var(--soft); margin: 0; }
      .ok { color: var(--ok); font-weight: 700; }
      .errs { margin: 0; padding-left: 20px; color: var(--err); font-size: 14px; }
      .row { display: flex; gap: 16px; flex-wrap: wrap; }
      .link { background: none; border: 0; padding: 8px 0; color: var(--brand-dark); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
      .open { display: block; text-align: center; padding: 14px; border-radius: 14px; border: 2px solid var(--brand); color: var(--brand-dark); font-weight: 700; font-size: 17px; text-decoration: none; }
      .open:active { background: var(--bg); }
      .blind { color: transparent; caret-color: transparent; text-align: center; font-size: 18px; min-height: 120px; border: 2px dashed var(--brand); }
      .blind::placeholder { color: var(--brand-dark); font-weight: 700; line-height: 90px; }
      .blind::selection { background: transparent; }
      textarea { width: 100%; min-height: 160px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font: 16px/1.4 ui-monospace, Menlo, monospace; }
      .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
      .big {
        display: block; width: 100%; max-width: 528px; margin: 0 auto; min-height: 60px; border: 0; border-radius: 16px; cursor: pointer;
        background: var(--brand); color: #fff; font: 700 19px/1 system-ui, sans-serif; box-shadow: 0 6px 18px rgba(15, 157, 117, 0.35);
      }
      .big:active { background: var(--brand-dark); transform: scale(0.99); }
      .big:disabled { opacity: 0.55; cursor: default; }
      .big.alt { background: var(--warn); box-shadow: 0 6px 18px rgba(183, 121, 31, 0.3); }
      .ring { width: 18px; height: 18px; border: 3px solid rgba(255, 255, 255, 0.5); border-top-color: #fff; border-radius: 50%; display: inline-block; vertical-align: -3px; margin-right: 10px; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
      .emoji { font-size: 64px; }
      .toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 15px; z-index: 5; }
      .ver { text-align: center; font-size: 11px; color: var(--soft); margin-top: 18px; }
      @media (prefers-reduced-motion: reduce) { .ring { animation-duration: 2.5s; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/parrot.tsx"></script>
  </body>
</html>
