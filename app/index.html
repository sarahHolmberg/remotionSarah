<!doctype html>
<!-- app/index.html -->
<!-- NEW FILE: the first page, transcription (app/transcribe.tsx). The comic editor moved to editor.html. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#245edb" />
    <title>Transcribe</title>
    <style>
      /* the same Windows XP look as the editor (app/editor.html), mobile first */
      :root { --beige: #ece9d8; --line: #aca899; --blue: #0a5fe0; --link: #0046d5; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; font-family: Tahoma, "Segoe UI", system-ui, sans-serif; font-size: 14px; color: #000;
        background: linear-gradient(#4f8fe6 0%, #a9d0f7 45%, #b9e08f 46%, #5fa43a 72%, #3f7d27 100%) fixed;
      }
      .desk { min-height: 100dvh; padding: 6px 6px 20px; }
      .win { width: 100%; max-width: 760px; margin: 0 auto; background: var(--beige); border: 3px solid var(--blue); border-top: 0; border-radius: 9px 9px 3px 3px; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45); overflow: hidden; }
      .title { display: flex; align-items: center; gap: 8px; padding: 6px 8px; color: #fff; font-weight: 700; font-size: 15px; text-shadow: 1px 1px 0 #0a246a; background: linear-gradient(#3d95ff 0%, #0a5fe0 12%, #0553d0 72%, #0a47b8 100%); }
      .ticon { width: 18px; height: 18px; border-radius: 3px; background: linear-gradient(135deg, #f35325 50%, #81bc06 50%); box-shadow: 0 0 0 1px #fff; flex: none; }
      .body { display: flex; flex-direction: column; gap: 14px; padding: 14px 10px 10px; }
      .group { position: relative; border: 1px solid var(--line); border-radius: 4px; padding: 14px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
      .gtitle { position: absolute; top: -9px; left: 8px; padding: 0 4px; background: var(--beige); color: var(--link); font-size: 12px; font-weight: 700; }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .file { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: #fff; border: 1px solid #7f9db9; padding: 8px; font-size: 13px; }
      .drop { border: 2px dashed #7f9db9; border-radius: 6px; padding: 18px; text-align: center; background: #fff; color: #444; }
      .drop.over { border-color: var(--blue); background: #eaf2ff; }
      .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 6px 16px; cursor: pointer; user-select: none; font: inherit; color: #000; text-decoration: none; border: 1px solid #003c74; border-radius: 4px; background: linear-gradient(#fff 0%, #f1efe7 70%, #d6d0c5 100%); }
      .btn:hover { box-shadow: inset 0 0 0 2px #f8b636; }
      .btn:disabled { color: #8a8a8a; cursor: default; box-shadow: none; }
      .btn.go { font-weight: 700; border-color: #2a6d1d; background: linear-gradient(#e9f7e2, #b9e08f); }
      .code { width: 100%; min-height: 220px; resize: vertical; padding: 8px; background: #fff; border: 1px solid #7f9db9; border-radius: 2px; font: 16px/1.45 Consolas, "Courier New", monospace; }
      .hint { font-size: 12px; color: #555; }
      .err { color: #b3261e; }
      .ok { color: #1c6b1c; }
      .sbar { padding: 5px 10px; font-size: 12px; border-top: 1px solid var(--line); text-align: center; font-weight: 700; }
      @media (min-width: 700px) { .desk { padding: 28px; } .code { font-size: 13px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/transcribe.tsx"></script>
  </body>
</html>
