<!doctype html>
<!-- app/index.html -->
<!-- NOT NEW: existing file, changed (editor and preview side by side: .split / .pv) -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#245edb" />
    <title>Comic editor</title>
    <style>
      /* mobile first: this is the phone layout; the @media block at the bottom only adds things for wider screens */
      :root { --beige: #ece9d8; --line: #aca899; --blue: #0a5fe0; --link: #0046d5; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: Tahoma, "Segoe UI", system-ui, sans-serif;
        font-size: 14px;
        color: #000;
        background: linear-gradient(#4f8fe6 0%, #a9d0f7 45%, #b9e08f 46%, #5fa43a 72%, #3f7d27 100%) fixed; /* "Bliss" */
      }
      .desk { min-height: 100dvh; display: flex; flex-direction: column; padding: 6px 6px calc(54px + env(safe-area-inset-bottom)); }
      .win {
        flex: 1; display: flex; flex-direction: column; min-height: 0;
        width: 100%; max-width: 1200px; margin: 0 auto;
        background: var(--beige); border: 3px solid var(--blue); border-top: 0; border-radius: 9px 9px 3px 3px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45); overflow: hidden;
      }
      .title {
        display: flex; align-items: center; gap: 8px; padding: 6px 5px 6px 8px; color: #fff; font-weight: 700; font-size: 15px;
        text-shadow: 1px 1px 0 #0a246a;
        background: linear-gradient(#3d95ff 0%, #0a5fe0 12%, #0553d0 72%, #0a47b8 100%);
      }
      .ticon { width: 18px; height: 18px; border-radius: 3px; background: linear-gradient(135deg, #f35325 50%, #81bc06 50%); box-shadow: 0 0 0 1px #fff; flex: none; }
      .ttext { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cb {
        flex: none; width: 26px; height: 26px; border: 1px solid #fff; border-radius: 4px; color: #fff; font-size: 14px; line-height: 24px; text-align: center;
        background: linear-gradient(#5aa0ff, #2f6fe4 60%, #2658c8); text-shadow: none;
      }
      .cb.x { background: linear-gradient(#e8836b, #d9482a 60%, #b8321a); }
      .body { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 14px 10px 10px; min-height: 0; }
      .group { position: relative; border: 1px solid var(--line); border-radius: 4px; padding: 14px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
      .group.grow { flex: 1; min-height: 240px; }
      .gtitle { position: absolute; top: -9px; left: 8px; padding: 0 4px; background: var(--beige); color: var(--link); font-size: 12px; font-weight: 700; }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .file { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: #fff; border: 1px solid #7f9db9; padding: 8px; font-size: 13px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 6px 16px; cursor: pointer; user-select: none;
        font: inherit; color: #000; border: 1px solid #003c74; border-radius: 4px;
        background: linear-gradient(#fff 0%, #f1efe7 70%, #d6d0c5 100%);
      }
      .btn:hover { box-shadow: inset 0 0 0 2px #f8b636; }
      .btn:active { background: linear-gradient(#d6d0c5, #f1efe7); }
      .code {
        flex: 1; min-height: 220px; width: 100%; resize: none; padding: 8px; color: #000; background: #fff; border: 1px solid #7f9db9; border-radius: 2px;
        font: 16px/1.4 Consolas, "Courier New", monospace; /* 16px so iPhones do not zoom in */
      }
      .status { background: #fff; border: 1px solid #7f9db9; padding: 6px 8px; max-height: 150px; overflow: auto; font-size: 13px; }
      .msg { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; }
      .ico { flex: none; width: 16px; height: 16px; border-radius: 50%; color: #fff; font: 700 11px/16px Tahoma, sans-serif; text-align: center; }
      .ico.err { background: #d9382a; }
      .ico.warn { background: #f5c518; color: #000; }
      .ico.ok { background: #2f9e2f; }
      .sbar { display: flex; justify-content: space-between; gap: 8px; padding: 5px 10px; font-size: 12px; border-top: 1px solid var(--line); background: var(--beige); }
      .sbar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .task {
        position: fixed; left: 0; right: 0; bottom: 0; height: calc(44px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
        display: flex; align-items: stretch; gap: 8px; border-top: 1px solid #0b3a9a;
        background: linear-gradient(#3f8cf3 0%, #245edb 10%, #245edb 60%, #1941a5 100%);
      }
      .start {
        display: flex; align-items: center; gap: 8px; padding: 0 22px 0 12px; color: #fff; text-decoration: none; font-size: 19px; font-weight: 700; font-style: italic;
        text-shadow: 1px 1px 2px #1b4d12; border-radius: 0 16px 16px 0; box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.6), 2px 0 4px rgba(0, 0, 0, 0.4);
        background: linear-gradient(#6cc35a 0%, #3c9a2c 15%, #2f8a22 70%, #276f1b 100%);
      }
      .start:active { filter: brightness(0.9); }
      .logo { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; width: 18px; height: 18px; transform: skew(-4deg); }
      .logo i { display: block; }
      .logo i:nth-child(1) { background: #f35325; } .logo i:nth-child(2) { background: #81bc06; }
      .logo i:nth-child(3) { background: #05a6f0; } .logo i:nth-child(4) { background: #ffba08; }
      .taskbtn {
        align-self: center; padding: 6px 14px; color: #fff; font-size: 13px; border-radius: 3px; border: 1px solid #0b3a9a;
        background: linear-gradient(#1c4ec0, #3a76e0); box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.4);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
      }
      /* two columns on wide screens (files + JSON | settings), one under the other on a phone */
      .body.cols { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; overflow: auto; }
      .stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
      .fold { cursor: pointer; color: var(--link); font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 8px; list-style: none; }
      .fold::-webkit-details-marker { display: none; }
      .fold::before { content: "▸"; color: #000; }
      details[open] > .fold::before { content: "▾"; }
      details[open] > .fold { margin-bottom: 8px; }
      details .code { height: 280px; flex: none; resize: vertical; }
      .hint { font-size: 12px; color: #555; font-weight: 400; }
      select.file { min-height: 40px; font: inherit; }
      .btn:disabled { color: #8a8a8a; cursor: default; box-shadow: none; }
      @media (min-width: 900px) {
        .body.cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); }
      }

      /* editor + preview side by side on a wide screen (the preview stays in view while the editor scrolls) */
      .split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-items: start; }
      .pv { background: #120e1c; color: #eee; border-radius: 8px; font-family: system-ui, sans-serif; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45); min-width: 0; }
      .pv a { color: #9cc4ff; }
      @media (min-width: 1100px) {
        .split { grid-template-columns: minmax(400px, 520px) minmax(0, 1fr); }
        .split .win { max-height: calc(100dvh - 90px); }
        .split .body.cols { grid-template-columns: minmax(0, 1fr); } /* the editor is one column next to the preview */
        .pv { position: sticky; top: 8px; max-height: calc(100dvh - 70px); overflow: auto; }
      }

      /* wider screens: a real floating window */
      @media (min-width: 700px) {
        .desk { padding: 28px 28px 60px; }
        .win { border-radius: 10px 10px 4px 4px; }
        .code { font-size: 13px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>console.log("[IndexHtml] 1. html loaded, /editor.tsx comes next");</script>
    <script type="module" src="/editor.tsx"></script>
  </body>
</html>
